services:
  app:
    build: .
    restart: unless-stopped
    # The image runs as uid 1000 (`node`). APP_UID/APP_GID, written by
    # `init-env`, make it run as whoever owns DATA_DIR on this host instead, so
    # the files it creates belong to you and need no sudo. See install.md.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      DATA_DIR: /data
      PUBLIC_ORIGIN: https://${DOMAIN}
      PORT: "3000"
      HOST: "0.0.0.0"
    volumes:
      - ${DATA_DIR:-./data}:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Site address for the git remote. `init-env --git` fills it. The fallback
      # only keeps Caddy's config valid when git is off.
      GIT_DOMAIN: ${GIT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  git:
    # Enable with COMPOSE_PROFILES=git in .env (or: docker compose --profile git up)
    profiles: [git]
    build: ./deploy/git
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      GIT_HTTP_TOKEN: ${GIT_HTTP_TOKEN}
      GIT_SYNC_SECRET: ${GIT_SYNC_SECRET}
      GIT_SYNC_URL: ${GIT_SYNC_URL:-http://app:3000/api/adapter/sync}
    volumes:
      - ${DATA_DIR:-./data}:/data

  mailpit:
    # Dev/testing only, never for a real deployment: a fake SMTP server that
    # captures every notification email instead of delivering it, with a web
    # inbox at http://localhost:8025. Enable with COMPOSE_PROFILES=mail in
    # .env, or: docker compose --profile mail up -d mailpit
    #
    # Point SMTP_URL at it: smtp://localhost:1025 for a host-run `npm run dev`,
    # or smtp://mailpit:1025 for the Compose app container (same network, so it
    # reaches this service by name). Swap SMTP_URL/MAIL_FROM to a real
    # provider's values (see notifications.md) to test real-world delivery
    # instead — nothing else about the setup changes.
    profiles: [mail]
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    restart: unless-stopped
    # Bound to loopback: a dev tool that must never be reachable from outside
    # this machine, even if the profile is accidentally left on.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  litestream:
    profiles: [backup]
    image: litestream/litestream:0.5@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    restart: unless-stopped
    command: replicate
    # Same user as the app: it must be able to read the database the app writes,
    # and a database it restores must be one the app can write.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # Compose only substitutes ${...} in this file; it does not forward .env to a
    # container. Without this block litestream.yml sees an empty
    # ${LITESTREAM_REPLICA_URL} and exits with "file replica path required".
    # Empty defaults (not `:?`) because Compose interpolates the whole file even
    # for profiles that are not enabled, and that would break every other user.
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  caddy_data:
  caddy_config:
