<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="same-origin" />
		<style>
			html[data-glassine-tab-check] {
				visibility: hidden !important;
			}
		</style>
		<script>
			try {
				var t = localStorage.getItem('glassine-theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				var p = localStorage.getItem('glassine-chrome-position');
				if (p === 'top' || p === 'bottom') document.documentElement.setAttribute('data-chrome-position', p);
			} catch (e) {}
		</script>
		<script src="%sveltekit.assets%/tab-choice.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
