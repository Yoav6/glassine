# Builds the production image and publishes it to the GitHub Container Registry
# (ghcr.io/<owner>/<repo>) on every commit that lands on `main`, and on every
# `v*` release tag.
#
# Only `main` publishes. The "Protect main" ruleset requires the checks in
# ci.yml to pass before a change can merge, so an image is only ever built from
# a commit that has already been tested. Pull requests and other branches are
# not pushed: Dependabot and fork runs get a read-only token that could not
# push anyway, and an unmerged branch is not something to hand out as an image.
# ci.yml's `docker` job still builds the image on pull requests without pushing.
#
# The image is a multi-arch manifest (linux/amd64 and linux/arm64), so the same
# tag pulls on an x86 VPS and on an ARM one (Hetzner CAX, Raspberry Pi, Apple
# silicon under Docker). Docker picks the matching variant automatically.
#
# Tags on each image:
#   sha-<short>   the exact commit; immutable, use this to pin or roll back
#   latest        the newest commit on main
#   1.2.3 / 1.2   only when a `v1.2.3` git tag is pushed
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Publishing must not run with more than it needs. Individual jobs opt in to
# the one extra permission they use.
permissions:
  contents: read

# Never cancel a publish in flight: if two commits land close together, both
# should end up with their own sha-<short> image rather than the first vanishing.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to ghcr.io. No personal access
      # token or stored secret is involved.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job only reads the tree; it never pushes to git, so the token
          # does not need to stay on disk for later steps.
          persist-credentials: false

      # Registry names must be lowercase, but the repository owner may not be
      # (github.repository is e.g. "Yoav6/glassine").
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Registers QEMU so the amd64 runner can build the arm64 variant.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the tag list above and the OCI labels. The
      # org.opencontainers.image.source label is what links the package to this
      # repository on GitHub, which is what lets it inherit the repo's access.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Both variants are built here even though the arm64 one runs under
      # emulation. That is affordable because nothing is compiled: better-sqlite3
      # ships a prebuilt musl binary for each architecture inside the package,
      # and the install runs with --ignore-scripts, so the emulated part is only
      # `npm ci` and `vite build`. Base images are pinned by index digest in the
      # Dockerfile, which covers both architectures.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
